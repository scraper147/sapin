<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#3F7A26">
<title>Caisse Sapins Agri-Garden</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
/* Couleurs de la caisse : --green = couleur principale, --green-d foncée, --accent, --tint fond des encadrés, --ground fond général. Palette sombre plus bas. */
:root{--green:#3F7A26;--green-d:#2E5C1B;--accent:#8BC43F;--tint:#EEF6E4;--ground:#F7F8F4;--line:#DDE3D5;--line2:#C9D1BF;--soft:#EEF2E8;--text:#26301F;--muted:#5E625A;--faint:#6B6E66;--red:#A33A2B;--amber:#A35A00;--surface:#fff;--on-green:#fff;--warn-bg:#FBEDE3;--warn-text:#7A3D00;color-scheme:light}
/* Mode sombre (bouton lune/soleil dans la barre du haut) */
:root[data-theme="dark"]{--green:#7FB069;--green-d:#B5D99C;--accent:#C9A66B;--tint:#22301C;--ground:#0D110B;--surface:#161C13;--line:#273022;--line2:#384431;--soft:#1F271A;--text:#E6EBDF;--muted:#A6AE9E;--faint:#8D9586;--red:#E8836F;--amber:#E3A653;--on-green:#0F140C;--warn-bg:#3A2619;--warn-text:#F2BC8C;color-scheme:dark}
:root[data-theme="dark"] .overlay{background:rgba(0,0,0,.6)}
:root[data-theme="dark"] .menu{box-shadow:0 12px 32px rgba(0,0,0,.5)}
:root[data-theme="dark"] pre.json{background:#0A0D08}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--ground);color:var(--text);font-family:"Nunito","Segoe UI",Roboto,system-ui,sans-serif;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;color:var(--text)}
button:active{transform:scale(.98)}
button:disabled{opacity:.45;cursor:not-allowed}
input{font-family:inherit;background:var(--surface);color:var(--text)}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
#app{height:100%;position:relative;overflow:hidden;user-select:none}
.full{height:100%;display:flex;flex-direction:column}
.center{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:var(--surface)}
.btn{height:56px;padding:0 26px;border-radius:12px;font-size:18px;font-weight:700;border:1px solid var(--line2);background:var(--surface)}
.btn-primary{border:none;background:var(--green);color:var(--on-green);font-weight:800}
.btn-big{min-width:360px;height:76px;font-size:26px}
.btn-link{border:none;background:transparent;color:var(--green);font-weight:700;text-decoration:underline;font-size:15px;height:40px}
.btn-danger{border:none;background:transparent;color:var(--red);font-weight:700}
.card{width:min(720px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:32px 36px;display:flex;flex-direction:column;gap:22px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.choice{height:60px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);font-size:18px;font-weight:700}
.choice.on{border:2px solid var(--green);background:var(--tint);color:var(--green-d);font-weight:800}
.header{height:68px;flex-shrink:0;display:flex;align-items:center;gap:20px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.header img{height:48px;border-radius:8px}
.seg{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:12px}
.seg button{height:44px;padding:0 22px;border:none;border-radius:9px;background:transparent;font-size:17px;font-weight:700}
.seg button.on{background:var(--green);color:var(--on-green);font-weight:800}
.place{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700}
.iconbtn{width:48px;height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center}
.body{flex:1;display:flex;min-height:0}
.catalog{flex:1;display:flex;flex-direction:column;gap:16px;padding:16px 18px;min-width:0;overflow-y:auto}
.cats{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cat{height:48px;padding:0 22px;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-size:17px;font-weight:700}
.cat.on{border-color:var(--green);background:var(--green);color:var(--on-green);font-weight:800}
.free{height:48px;padding:0 20px;border:2px dashed var(--accent);border-radius:12px;background:var(--surface);color:var(--green);font-size:17px;font-weight:800;margin-left:auto}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;align-content:start}
.prod{height:120px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:14px 16px;text-align:left}
.prod .m{font-size:19px;font-weight:800;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prod .s{font-size:14px;color:var(--muted)}
.prod .p{font-size:19px;font-weight:800;color:var(--green)}
.cart{width:380px;flex-shrink:0;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--line)}
.cart-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px}
.cart-h h2{margin:0;font-size:22px;font-weight:800}
.lines{flex:1;overflow-y:auto;padding:0 10px}
.empty{padding:40px 12px;text-align:center;color:var(--faint);font-size:16px}
.line{display:flex;align-items:center;gap:8px;padding:10px 6px;border-bottom:1px solid var(--soft)}
.line .info{flex:1;min-width:0;border:none;background:transparent;text-align:left;padding:0;display:flex;flex-direction:column;gap:2px}
.line .n{font-size:16px;font-weight:700}
.line .u{font-size:13px;color:var(--muted)}
.line .d{font-size:13px;font-weight:700;color:var(--amber)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:40px;height:40px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);font-size:22px;font-weight:700}
.qty span{width:26px;text-align:center;font-size:18px;font-weight:800}
.line .t{width:80px;text-align:right;font-size:17px;font-weight:800}
.cart-f{padding:12px 18px 18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center}
.small{height:40px;padding:0 14px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);font-size:15px;font-weight:700}
.total{font-size:34px;font-weight:800}
.pay{height:68px;border:none;border-radius:14px;background:var(--green);color:var(--on-green);font-size:24px;font-weight:800}
.hist{flex:1;overflow-y:auto;padding:20px 26px}
.hist h2{margin:0 0 14px;font-size:24px;font-weight:800}
.table{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sale{display:grid;grid-template-columns:110px minmax(0,1fr) 240px 110px;gap:16px;align-items:start;padding:14px 18px;border-bottom:1px solid var(--soft)}
.sale .h{font-size:20px;font-weight:800}
.sale .l{display:flex;flex-direction:column;gap:3px;font-size:16px}
.sale .pm{font-size:15px;color:var(--muted);font-weight:600}
.sale .tt{font-size:20px;font-weight:800;text-align:right}
.menu{position:absolute;top:72px;right:18px;width:340px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(28,34,25,.18);padding:8px;display:flex;flex-direction:column;z-index:5}
.menu button{height:52px;border:none;background:transparent;border-radius:10px;text-align:left;padding:0 14px;font-size:17px;font-weight:700}
.menu .meta{padding:10px 14px 6px;font-size:13px;color:var(--faint);border-top:1px solid var(--soft);margin-top:4px}
.toast{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:16px 26px;border-radius:14px;font-size:18px;font-weight:700;z-index:20;max-width:90vw;text-align:center}
.overlay{position:absolute;inset:0;background:rgba(28,34,25,.45);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
.modal{width:min(560px,96vw);max-height:96%;overflow-y:auto;background:var(--surface);border-radius:18px;padding:26px 28px;display:flex;flex-direction:column;gap:16px}
.modal h2{margin:0;font-size:24px;font-weight:800}
.sub{font-size:15px;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:15px;font-weight:700;color:var(--muted)}
label.f input{height:52px;border:1px solid var(--line2);border-radius:10px;padding:0 14px;font-size:20px;color:var(--text);font-weight:700}
.actions{display:flex;gap:12px;justify-content:flex-end;align-items:center}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mode{height:60px;border:1px solid var(--line2);border-radius:12px;background:var(--surface);font-size:19px;font-weight:700}
.mode.on{border:2px solid var(--green);background:var(--green);color:var(--on-green);font-weight:800}
.bills{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.bill{height:60px;border:1px solid var(--line2);border-radius:12px;background:var(--ground);font-size:20px;font-weight:800}
.bill.exact{background:var(--surface);font-size:14px;color:var(--green)}
.result{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-radius:14px;background:var(--tint)}
.result.ko{background:var(--warn-bg)}
.result b{font-size:20px}
.result span{font-size:34px;font-weight:800}
pre.json{flex:1;margin:0;overflow:auto;background:#151B12;color:#E4EBDC;border-radius:12px;padding:16px 18px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;user-select:text;min-height:300px}
.demo{position:absolute;top:10px;left:12px;font-size:12px;color:var(--faint)}
@media (max-width:1000px){.cart{width:320px}.sale{grid-template-columns:80px minmax(0,1fr) 150px 90px}}

/* ---------- Vue smartphone (html.phone) ---------- */
.phone .header{height:56px;gap:10px;padding:0 12px}
.phone .header img{height:36px}
.phone .iconbtn{width:44px;height:44px}
.subbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0}
.subbar .seg{padding:4px}
.subbar .seg button{height:38px;padding:0 16px;font-size:15px}
.subbar .place{margin-left:auto;font-size:13px;gap:5px;color:var(--muted);text-align:right}
.phone .body{flex-direction:column;position:relative}
.phone .catalog{padding:12px 12px 92px;gap:12px}
.phone .cats{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px 2px;gap:8px}
.phone .cats::-webkit-scrollbar{display:none}
.phone .cat{flex-shrink:0;height:42px;padding:0 16px;font-size:15px}
.phone .free{flex-shrink:0;height:42px;padding:0 14px;font-size:15px;margin-left:0}
.phone .products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.phone .prod{height:100px;padding:12px}
.phone .prod .m{font-size:16px}
.phone .prod .s{font-size:12px}
.phone .prod .p{font-size:17px}
.cartbar{position:absolute;left:12px;right:12px;bottom:12px;height:62px;border:none;border-radius:16px;background:var(--green);color:var(--on-green);display:flex;align-items:center;gap:12px;padding:0 18px;font-size:17px;font-weight:800;z-index:3;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.cartbar .n{background:var(--on-green);color:var(--green);min-width:30px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:15px;padding:0 8px}
.cartbar .tt{margin-left:auto;font-size:20px}
.phone .cart{position:absolute;inset:0;width:auto;border-left:none;z-index:4;display:none}
.phone .cart.open{display:flex}
.phone .cart-h{padding:10px 12px 6px;gap:10px}
.phone .cart-h h2{font-size:20px;margin-right:auto}
.back{height:40px;padding:0 12px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);font-size:15px;font-weight:700}
.phone .line .n{font-size:15px}
.phone .qty button{width:38px;height:38px}
.phone .line .t{width:66px;font-size:16px}
.phone .cart-f{padding:12px 12px calc(14px + env(safe-area-inset-bottom,0px))}
.phone .total{font-size:28px}
.phone .pay{height:60px;font-size:22px}
.phone .hist{padding:14px 12px}
.phone .hist h2{font-size:20px}
.phone .sale{grid-template-columns:1fr auto;grid-template-areas:"h tt" "l l" "pm pm";gap:4px 12px;padding:12px 14px}
.phone .sale .h{grid-area:h;font-size:17px}.phone .sale .tt{grid-area:tt;font-size:17px}
.phone .sale .l{grid-area:l;font-size:15px}.phone .sale .pm{grid-area:pm;font-size:13px}
.phone .menu{top:60px;left:8px;right:8px;width:auto}
.phone .overlay{padding:0;align-items:flex-end}
.phone .modal{width:100% !important;max-height:94%;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));gap:14px}
.phone .modal h2{font-size:20px}
.phone .paymodal .row>span{font-size:30px !important}
.phone .actions{flex-wrap:wrap}
.phone .actions .btn{flex:1;padding:0 14px;height:54px !important;font-size:17px !important}
.phone .modes .mode{height:52px;font-size:clamp(13px,4vw,16px);padding:0 2px;min-width:0;white-space:nowrap}
.phone .bills{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.phone .bill{height:52px;font-size:18px}
.phone .result{padding:12px 14px}.phone .result span{font-size:26px}
.phone label.f input{height:48px;font-size:18px}
.phone .center{padding:16px;gap:18px}
.phone .center img{width:min(340px,88%) !important}
.phone .btn-big{min-width:0;width:100%;max-width:340px;height:64px;font-size:22px}
.phone .card{width:100%;padding:20px 16px;gap:18px}
.phone .card h1,.phone .card h2{font-size:22px}
.phone .toast{bottom:88px;font-size:16px;padding:14px 18px;width:max-content;max-width:calc(100% - 24px)}
.phone:not(.framed) #app{padding-top:env(safe-area-inset-top,0px)}
.phone .card .row{flex-direction:column;align-items:stretch !important}
.phone .card .row .btn{width:100%}
.phone label.f{min-width:0}
.phone label.f input{width:100%;min-width:0}
.phone .modal .btn-danger{padding:0 8px;flex-shrink:0}
/* Maquette sur grand écran (inutilisé dans l'app) : cadre de téléphone */
.framed body{display:flex;align-items:center;justify-content:center;background:#C9CCC4}
.framed[data-theme="dark"] body{background:#050705}
.framed #app{width:390px;height:min(844px,calc(100% - 32px));border-radius:36px;border:10px solid #111;box-shadow:0 20px 60px rgba(0,0,0,.35);background:var(--ground)}
.memwarn{display:block;width:100%;flex-shrink:0;border:none;background:var(--warn-bg);color:var(--warn-text);font-size:15px;font-weight:700;padding:10px 16px;text-align:center}
.center .memwarn{width:auto;max-width:min(560px,92%);border-radius:12px}
.memgauge{display:flex;flex-direction:column;gap:6px;font-size:15px}
.memgauge .bar{height:10px;border-radius:5px;background:var(--soft);overflow:hidden}
.memgauge .bar i{display:block;height:100%}
.dayact{display:flex;align-items:center;gap:8px;flex-shrink:0}
.phone .dayact{flex-wrap:wrap;justify-content:flex-end}
.actions.stack{flex-wrap:wrap}
.phone .actions.stack{flex-direction:column-reverse}
.phone .actions.stack .btn{width:100%;flex:none}
.paybody{display:grid;gap:inherit}
.paybody>div{grid-area:1/1;display:flex;flex-direction:column;gap:inherit;min-width:0}
.payghost{visibility:hidden;pointer-events:none}
.paycur.mid{justify-content:center}
.bills.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.phone .bills.five{grid-template-columns:repeat(3,minmax(0,1fr))}
/* Téléphone : l'encaissement occupe tout l'écran, boutons Retour / Valider collés en bas */
.phone .modal.paymodal{height:100%;max-height:100%;border-radius:0;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.phone .paymodal .paybody{flex:1}
.phone .paymodal .actions{margin-top:auto}
.phone .paymodal .bill{height:62px;font-size:19px}
.phone .paymodal .modes .mode{height:56px}
.phone:not(.framed) .overlay:has(.paymodal){padding-top:0}
.addcat>*{flex-shrink:0}
.nacats{display:flex;flex-wrap:wrap;gap:8px}
.nacats .choice{height:46px;padding:0 16px;font-size:16px}
.idv{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;background:var(--soft,#EEF2E8);padding:1px 6px;border-radius:6px;user-select:all}
.naitem{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.naitem .btn{flex-shrink:0;height:44px}
.phone .addcat .grid2{grid-template-columns:1fr}
.manage{flex:1;overflow-y:auto;padding:20px 24px 40px;display:flex;flex-direction:column;gap:16px}
.manage>*{width:100%;max-width:900px;margin:0 auto}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.mhead h2{margin:0 0 6px;font-size:24px;font-weight:800}
.mhead .btn{flex-shrink:0}
.mcat{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;flex-shrink:0}
.mcat-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--soft)}
.mct{display:flex;flex-direction:column;gap:2px}.mct strong{font-size:18px}
.catsw{display:flex;align-items:center;gap:10px;border:none;background:none;font:inherit;font-size:14px;font-weight:700;color:var(--muted);padding:6px 0;cursor:pointer}
.mrow{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:16px;width:100%;min-height:62px;padding:10px 16px;border:none;border-top:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;text-align:left;cursor:pointer}
.mrow .mn{display:flex;flex-direction:column;gap:2px;font-size:17px;font-weight:700;min-width:0}
.mrow .mid{font-size:12px;font-weight:400;color:var(--faint);font-family:ui-monospace,Menlo,Consolas,monospace}
.mrow .mp{font-size:17px;font-weight:800;color:var(--green)}
.mrow.off .mn>span:first-child,.mrow.off .mp{opacity:.4;text-decoration:line-through}
.sw{width:52px;height:30px;border-radius:15px;background:var(--line2);position:relative;flex-shrink:0;display:inline-block;transition:background .15s}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.sw.on{background:var(--green)}.sw.on i{left:25px}
.sw.part{background:var(--accent)}
.badge{font-style:normal;font-size:11px;font-weight:800;background:var(--tint);color:var(--green-d);padding:2px 6px;border-radius:6px;margin-left:8px;vertical-align:2px}
.emptycat{grid-column:1/-1;padding:24px;color:var(--muted);font-size:17px;line-height:1.5}
.phone .manage{padding:14px 12px 30px;gap:12px}
.phone .mhead{flex-direction:column;align-items:stretch}
.phone .mhead h2{font-size:21px}
.phone .mrow{gap:10px;padding:10px 12px}
.phone .mcat-h{padding:10px 12px}
.phone .catsw{font-size:13px}
.mtog{border:none;background:none;font:inherit;color:inherit;text-align:left;padding:0;cursor:pointer;min-height:44px;display:flex;align-items:center;min-width:0}
.mrow .mp{display:flex;flex-direction:column;align-items:flex-end;gap:1px;border:1px solid var(--line2);border-radius:10px;background:var(--surface);padding:6px 10px;font:inherit;font-size:17px;font-weight:800;color:var(--green);cursor:pointer}
.mrow .mp>span{display:flex;align-items:center;gap:6px}
.mrow .mp svg{color:var(--muted)}
.mrow .mp small{font-size:11px;font-weight:600;color:var(--muted)}
.mrow .mp.mod{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mrow{cursor:default}
.hhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:12px}
.hhead h2{margin:0 !important}
.hdays{display:flex;flex-wrap:wrap;gap:6px}
.hdays .choice{height:40px;padding:0 14px;font-size:15px}
.hsum{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:10px;font-size:17px}
.sale{grid-template-columns:110px minmax(0,1fr) 220px 100px 110px !important}
.sale .act{display:flex;justify-content:flex-end}
.sale .act .btn{height:42px;padding:0 14px;font-size:15px}
.sale.cancelled .h,.sale.cancelled .l>span:not(.annul),.sale.cancelled .pm,.sale.cancelled .tt{opacity:.45;text-decoration:line-through}
.sale .annul{color:var(--red);font-weight:700;font-size:14px}
.phone .sale{grid-template-columns:1fr auto !important;grid-template-areas:"h tt" "l l" "pm act" !important}
.phone .sale .act{grid-area:act}
.phone .hhead{flex-direction:column;align-items:flex-start}

/* Tuiles : la catégorie est déjà dans l'onglet ; le nom peut tenir sur 3 lignes */
.prod .s{display:none}
.prod .m{-webkit-line-clamp:3}
.phone .prod{height:104px}
.phone .ghcfg .actions .btn{width:100%}

/* La barre des catégories ne doit jamais rétrécir (sinon écrasée sur téléphone quand le catalogue est long) */
.cats{flex-shrink:0}
.phone .modal .row:has(.dayact){flex-direction:column;align-items:stretch;gap:8px}
.phone .dayact{justify-content:flex-start}
.phone .dayact .btn{flex:1 1 auto}
/* Menu ⋮ en tuiles */
.menu-back{position:absolute;inset:0;z-index:4}
.menu.tiles{width:min(500px,94vw);padding:14px;gap:8px;max-height:calc(100% - 90px);overflow-y:auto}
.menu.tiles .mgroup{font-size:13px;font-weight:800;color:var(--muted);padding:2px 4px 0}
.menu.tiles .mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.menu.tiles .mtile{height:auto;min-height:112px;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:6px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;color:var(--text);font-size:16px}
.menu.tiles .mtile svg{color:var(--green);flex-shrink:0;margin-bottom:2px}
.menu.tiles .mtile:active,.menu.tiles .mhome:active{background:var(--tint)}
.menu.tiles .mtile[disabled]{opacity:.6}
.menu.tiles .mt-l{font-weight:800;line-height:1.2}
.menu.tiles .mt-s{font-size:13px;font-weight:600;color:var(--muted);line-height:1.25}
.menu.tiles .mhome{height:56px;display:flex;align-items:center;gap:10px;padding:0 14px;margin-top:4px;border:1px solid var(--line);border-radius:12px;background:var(--soft);font-size:16px;font-weight:800;color:var(--text)}
.menu.tiles .mhome .mt-s{margin-left:auto}
.phone .menu.tiles{top:60px;left:8px;right:8px;width:auto}
.phone .menu.tiles .mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.phone .menu.tiles .mtile{min-height:104px;padding:12px}
.phone .menu.tiles .mhome .mt-s{display:none}
</style>

/* ---------- Catalogue ---------- */
var CAT_KEY = 'agrigarden-caisse-catalogue'; // propre à chaque caisse

/* Articles créés dans l'app (menu ⋮ → Ajouter un article). Gardés à part du catalogue officiel :
   une mise à jour de catalogue.json ne les efface pas. Si le catalogue officiel contient un jour le même ID,
   c'est la version officielle qui est utilisée. */
var ADD_KEY = STORE_KEY + '-ajouts';
var LOCAL = { produits: [] };
try { var lx = JSON.parse(localStorage.getItem(ADD_KEY)); if (lx && Array.isArray(lx.produits)) LOCAL = lx; } catch (e) {}
function withLocal(cat) {
  var ids = {};
  cat.categories.forEach(function (k) { k.produits.forEach(function (p) { ids[p.id] = 1; }); });
  LOCAL.produits.forEach(function (lp) {
    if (ids[lp.id]) return; ids[lp.id] = 1;
    var k = cat.categories.filter(function (c) { return c.id === lp.cat.id; })[0];
    if (!k) { k = { id: lp.cat.id, nom: lp.cat.nom, prefixe: false, produits: [] }; cat.categories.push(k); }
    k.produits.push({ id: lp.id, libelle: lp.libelle, prix: lp.prix, local: true });
  });
  return cat;
}
function allProductIds() { var o = {}; if (CATALOGUE) CATALOGUE.categories.forEach(function (k) { k.produits.forEach(function (p) { o[p.id] = p; }); }); return o; }
function rebuildCatalogue() {
  try { CATALOGUE = normalizeCatalogue(JSON.parse(localStorage.getItem(CAT_KEY))); }
  catch (e) {
    var keep = {}; LOCAL.produits.forEach(function (lp) { keep[lp.id] = 1; });
    CATALOGUE.categories.forEach(function (k) { k.produits = k.produits.filter(function (p) { return !p.local || keep[p.id]; }); });
    CATALOGUE.categories = CATALOGUE.categories.filter(function (k) { return k.produits.length; });
    applyPrices(withLocal(CATALOGUE));
  }
  if (!CATALOGUE.categories.some(function (k) { return k.id === S.cat; })) S.cat = CATALOGUE.categories[0].id;
}
function saveLocal() {
  try { localStorage.setItem(ADD_KEY, JSON.stringify(LOCAL)); refreshUsage(); return true; }
  catch (e) { S.modal = 'storage'; refreshUsage(); return false; }
}
var ID_RE = /^[a-z0-9][a-z0-9_-]{0,39}$/;
function uniqueId(base, taken) { base = base || 'article'; var id = base, n = 2; while (taken[id]) id = base + '-' + n++; return id; }

/* Articles désactivés sur cet appareil (menu ⋮ → Gérer le catalogue). Ils restent dans le catalogue
   mais n'apparaissent plus dans la caisse. Une catégorie sans article actif est masquée. */
var HID_KEY = STORE_KEY + '-desactives';
var HID = {};
try { HID = JSON.parse(localStorage.getItem(HID_KEY)) || {}; } catch (e) { HID = {}; }
function saveHid() {
  try { localStorage.setItem(HID_KEY, JSON.stringify(HID)); refreshUsage(); return true; }
  catch (e) { S.modal = 'storage'; refreshUsage(); return false; }
}
function visibleCats() {
  return CATALOGUE.categories.map(function (k) {
    return Object.assign({}, k, { produits: k.produits.filter(function (p) { return !HID[p.id]; }) });
  }).filter(function (k) { return k.produits.length; });
}

/* Prix modifiés sur cet appareil (Gérer le catalogue → toucher un prix). Ils remplacent le prix du catalogue
   pour les prochaines ventes et restent valables après une mise à jour de catalogue.json. */
var PX_KEY = STORE_KEY + '-prix';
var PRICES = {};
try { PRICES = JSON.parse(localStorage.getItem(PX_KEY)) || {}; } catch (e) { PRICES = {}; }
function savePrices() {
  try { localStorage.setItem(PX_KEY, JSON.stringify(PRICES)); refreshUsage(); return true; }
  catch (e) { S.modal = 'storage'; refreshUsage(); return false; }
}
function applyPrices(cat) {
  cat.categories.forEach(function (k) { k.produits.forEach(function (p) {
    if (p.prixCatalogue === undefined) p.prixCatalogue = p.prix;
    p.prix = PRICES[p.id] != null ? PRICES[p.id] : p.prixCatalogue;
  }); });
  return cat;
}

// Vérifie un catalogue et le prépare pour la caisse (filtre "actif", trie par "ordre").
function normalizeCatalogue(c) {
  if (!c || typeof c !== 'object') throw new Error('Le fichier ne contient pas un catalogue.');
  if (c.format && c.format !== 'agri-garden-caisse/catalogue') throw new Error('Ce fichier n’est pas un catalogue (format « ' + c.format + ' »).');
  if (!Array.isArray(c.pointsDeVente) || !Array.isArray(c.categories)) throw new Error('Il manque la liste des points de vente ou des catégories.');
  var ids = {};
  function byOrder(a, b) { return (a.ordre || 0) - (b.ordre || 0); }
  function active(x) { return x && x.actif !== false; }
  var pdv = c.pointsDeVente.filter(active).map(function (p) {
    if (!p.id || !p.nom) throw new Error('Un point de vente n’a pas d’identifiant ou de nom.');
    return { id: String(p.id), nom: String(p.nom) };
  });
  var cats = c.categories.filter(active).slice().sort(byOrder).map(function (k) {
    if (!k.id || !k.nom || !Array.isArray(k.produits)) throw new Error('Catégorie incomplète : ' + (k.nom || k.id || '?'));
    var prods = k.produits.filter(active).slice().sort(byOrder).map(function (p) {

  else if (newCat && !ID_RE.test(r.catId)) r.err = 'ID de catégorie invalide : lettres minuscules, chiffres, tirets (40 caractères max).';
  else if (newCat && cats[r.catId]) r.err = 'La catégorie « ' + r.catId + ' » existe déjà : choisissez-la dans la liste.';

  else if (!ID_RE.test(r.id)) r.err = 'ID d\u2019article invalide : lettres minuscules, chiffres, tirets (40 caractères max).';
  else if (allProductIds()[r.id]) r.err = 'L\u2019ID « ' + r.id + ' » est déjà utilisé.';

/* catalogue.json de l'appareil : le catalogue officiel installé + articles ajoutés, prix modifiés et
   articles désactivés (actif: false). Version +1, prêt à être déposé sur GitHub pour les autres appareils. */
function deviceCatalogue() {
  var c;
  try { c = JSON.parse(localStorage.getItem(CAT_KEY)); } catch (e) { c = null; }
  if (!c || !Array.isArray(c.categories)) return { err: 'catalogue introuvable sur l\u2019appareil' };
  var n = 0, ids = {}, maxCat = 0;
  c.categories.forEach(function (k) {
    maxCat = Math.max(maxCat, Number(k.ordre) || 0);
    (k.produits || []).forEach(function (p) {
      ids[p.id] = p;
      if (PRICES[p.id] != null && PRICES[p.id] !== p.prix) { p.prix = PRICES[p.id]; n++; }
      if (HID[p.id] && p.actif !== false) { p.actif = false; n++; }
    });
  });
  LOCAL.produits.forEach(function (lp) {
    if (ids[lp.id]) return;
    var k = c.categories.filter(function (x) { return x.id === lp.cat.id; })[0];
    if (!k) { k = { id: lp.cat.id, nom: lp.cat.nom, ordre: ++maxCat, actif: true, prefixe: false, produits: [] }; c.categories.push(k); }
    var maxP = k.produits.reduce(function (m, p) { return Math.max(m, Number(p.ordre) || 0); }, 0);
    k.produits.push({ id: lp.id, libelle: lp.libelle, prix: PRICES[lp.id] != null ? PRICES[lp.id] : lp.prix, ordre: maxP + 1, actif: !HID[lp.id] });
    ids[lp.id] = 1; n++;
  });
  c.version = (Number(c.version) || 0) + 1; c.date = today(); delete c.exemple;
  try { normalizeCatalogue(JSON.parse(JSON.stringify(c))); } catch (e) { return { err: e.message }; }
  return { cat: c, n: n };
}

      '<div class="result' + (ch >= -0.001 ? '' : ' ko') + '"><b>' + (ch >= -0.001 ? 'À rendre' : 'Il manque') + '</b><span>' + money(Math.abs(ch)) + '</span></div>';

      (mixC >= t - 0.001 && mixC > 0

  var ghost = S.payMode === 'cash' ? '' : '<div class="payghost" aria-hidden="true">' + cashBody().replace(/ data-(a|v|f)="[^"]*"/g, '') + '</div>';
  html += '<div class="paybody">' + ghost + '<div class="paycur' + (S.payMode === 'bc' ? ' mid' : '') + '">' + body + '</div></div>';
  return html + '<div class="actions"><button class="btn" data-a="close" style="height:60px">Retour</button><button class="btn btn-primary" data-a="validate" style="height:60px;font-size:20px;padding:0 36px"' + (can ? '' : ' disabled') + '>Valider la vente</button></div></div></div>';
}

function vStorageBar() {
  if (S.usedPct < 80) return '';
  return '<button class="memwarn" data-a="showDays">⚠ Mémoire de l\u2019appareil pleine à ' + S.usedPct + ' % : touchez ici pour effacer les anciens jours exportés</button>';
}

function vStorage() {
  return '<div class="overlay"><div class="modal" style="width:min(600px,96vw)">' +
    '<h2 style="color:var(--red)">Mémoire pleine : enregistrement impossible</h2>' +
    (S.storageMsg ? '<div class="result ko" style="display:block;font-size:18px;font-weight:800">' + esc(S.storageMsg) + '</div>' : '') +
    '<div style="font-size:17px;line-height:1.5">L\u2019appareil n\u2019a plus de place pour enregistrer les ventes. Elles restent disponibles <strong>tant que l\u2019app reste ouverte</strong>.</div>' +
    '<div style="font-size:17px;line-height:1.5"><strong>1.</strong> Exportez tout de suite les ventes du jour.<br><strong>2.</strong> Effacez les anciens jours déjà exportés.</div>' +
    '<div class="actions stack"><button class="btn" data-a="close">Fermer</button><button class="btn" data-a="showDays">Effacer d\u2019anciens jours</button><button class="btn btn-primary" data-a="download">Exporter les ventes du jour</button></div>' +
    '</div></div>';
}

function vDays() {
  var dates = Object.keys(S.days).filter(function (d) { return S.days[d] && S.days[d].length; }).sort().reverse();
  var rows = dates.map(function (d) {
    var s = validSales(S.days[d]), nAnn = S.days[d].length - s.length, tot = s.reduce(function (a, v) { return a + v.total; }, 0);
    var isToday = d === today();
    return '<div class="row" style="gap:12px;padding:12px 4px;border-bottom:1px solid var(--soft)">' +
      '<div style="display:flex;flex-direction:column;gap:2px"><strong style="font-size:18px">' + frDate(d) + (isToday ? ' <span class="sub">(aujourd’hui)</span>' : '') + '</strong>' +
      '<span class="sub">' + s.length + ' vente' + (s.length > 1 ? 's' : '') + ' · ' + money(tot) + (nAnn ? ' · ' + nAnn + ' annulée' + (nAnn > 1 ? 's' : '') : '') + (GH.envois[d] ? ' · envoyé sur GitHub le ' + GH.envois[d].slice(8, 10) + '/' + GH.envois[d].slice(5, 7) + ' à ' + GH.envois[d].slice(11, 16) : '') + '</span></div>' +
      '<div class="dayact">' + (isToday ? '' : !S.exported[d] ? '<span class="sub">Pas encore exporté</span>'
        : S.confirmDel === d ? '<button class="btn btn-danger" data-a="delDay" data-v="' + d + '" style="border:1px solid var(--red)">Confirmer l\u2019effacement</button>'
        : '<button class="btn btn-danger" data-a="askDel" data-v="' + d + '">Effacer</button>') +
      (!ghConfigured() ? '' : '<button class="btn" data-a="' + (ghReady() ? 'ghSend' : 'ghAsk') + '" data-v="' + d + '" style="flex-shrink:0"' + (S.ghBusy ? ' disabled' : '') + ' title="' + (GH.envois[d] ? 'Envoyé le ' + GH.envois[d].slice(0, 16).replace('T', ' à ') : 'Pas encore envoyé') + '">' + (S.ghBusy === d ? 'Envoi…' : GH.envois[d] ? 'Renvoyer sur GitHub' : 'Envoyer sur GitHub') + '</button>') +
      '<button class="btn" data-a="download" data-v="' + d + '" style="flex-shrink:0">Télécharger</button></div></div>';
  }).join('');
  return '<div class="overlay"><div class="modal" style="width:min(640px,96vw);max-height:90%">' +
    '<div class="row"><h2>Ventes enregistrées</h2><button class="btn" data-a="close">Fermer</button></div>' +
    '<div class="memgauge"><div class="row"><span>Mémoire de l\u2019appareil</span><strong' + (S.usedPct >= 80 ? ' style="color:var(--red)"' : '') + '>' + storageMo(storageUsed()) + ' sur ' + storageMo(STORAGE_LIMIT) + ' (' + S.usedPct + ' %)</strong></div>' +
      '<div class="bar"><i style="width:' + Math.min(100, S.usedPct) + '%;background:' + (S.usedPct >= 80 ? 'var(--red)' : 'var(--green)') + '"></i></div></div>' +
    '<div class="sub">Les ventes de chaque jour restent dans l\u2019appareil. Un jour ne peut être effacé qu\u2019après avoir été téléchargé. Le jour en cours ne peut pas être effacé.</div>' +
    '<div style="overflow-y:auto">' + (rows || '<div class="empty">Aucune vente enregistrée</div>') + '</div>' +
    '</div></div>';
}

function vJson() {
  return '<div class="overlay"><div class="modal" style="width:min(900px,96vw);height:92%"><div class="row"><div><h2>Fichier du jour</h2><div class="sub">' + esc(fileName()) + '</div></div>' +
    '<div style="display:flex;gap:10px"><button class="btn" data-a="download">Télécharger</button><button class="btn" data-a="close">Fermer</button></div></div>' +
    '<pre class="json">' + esc(JSON.stringify(dayFile(), null, 2)) + '</pre></div></div>';
}

/* ---------- Rendu ---------- */
var app = document.getElementById('app');
function render() {
  var act = document.activeElement, f = act && act.dataset ? act.dataset.f : null, pos = f ? act.selectionStart : null;
  var html = S.screen === 'home' ? vHome() : S.screen === 'setup' ? vSetup() : vPos();
  if (S.modal === 'free') html += vFree();
  else if (S.modal === 'disc') html += vDisc();
  else if (S.modal === 'pay') html += vPay();
  else if (S.modal === 'json') html += vJson();
  else if (S.modal === 'days') html += vDays();
  else if (S.modal === 'storage') html += vStorage();
  else if (S.modal === 'addcat') html += vAddCat();
  else if (S.modal === 'price') html += vPrice();
  else if (S.modal === 'cancel') html += vCancel();
  else if (S.modal === 'ghcfg') html += vGhCfg();
  else if (S.modal === 'ghres') html += vGhRes();
  else if (S.modal === 'import') html += vImport();
  if (S.toast) html += '<div class="toast">' + esc(S.toast) + '</div>';
  app.innerHTML = html;
  if (f) { var el = app.querySelector('[data-f="' + f + '"]'); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} } }
}
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  var fn = A[el.dataset.a]; if (!fn) return;
  fn(el.dataset.v); render();
});
document.addEventListener('input', function (e) {
  var f = e.target.dataset && e.target.dataset.f;
  if (f) { S[f] = e.target.value; render(); }
});
// Catalogue fourni avec l'application (catalogue.json à côté de index.html)
function installCat(raw, cat) {
  try { localStorage.setItem(CAT_KEY, JSON.stringify(raw)); } catch (e) {}
  CATALOGUE = cat; S.cat = cat.categories[0].id;
  if (S.placeId && !findPlace(S.placeId)) { S.placeId = null; persist(); }
}
function loadSiteCatalogue(manual) {
  /* hors ligne, le service worker renverrait la copie en cache : on ne peut rien vérifier */
  if (manual && CATALOGUE && navigator.onLine === false) { toast('Pas de réseau : impossible de vérifier le catalogue'); render(); return; }
  S.catLoading = true; render();
  fetch('catalogue.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (raw) {
      S.catLoading = false;
      var cat;
      try { cat = normalizeCatalogue(raw); }
      catch (err) { S.importing = { error: err.message }; S.modal = 'import'; render(); return; }
      if (!CATALOGUE) { installCat(raw, cat); toast(catalogueLabel(cat) + ' installé'); }
      else if (cat.version !== CATALOGUE.version || cat.exemple !== CATALOGUE.exemple || JSON.stringify(raw) !== localStorage.getItem(CAT_KEY)) {
        /* le contenu compte aussi : un ordre ou un prix changé sans changer la version est détecté */
        S.siteUpdate = { raw: raw, cat: cat };
        if ((manual || S.screen !== 'pos') && !S.modal) { S.importing = S.siteUpdate; S.modal = 'import'; } // pendant le service : seulement sur demande
      } else { S.siteUpdate = null; if (manual) toast('Le catalogue est à jour (' + catalogueLabel(CATALOGUE) + ')'); }
      render();
    })
    .catch(function () {
      S.catLoading = false;
      if (manual) toast('Pas de réseau : impossible de vérifier le catalogue');
      render();
    });
}
render();
loadSiteCatalogue(false);
// Stockage protégé : Chrome n'efface pas ces données de lui-même
if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(function () {}); }
// Fonctionnement hors ligne
if ('serviceWorker' in navigator && location.protocol !== 'file:') { navigator.serviceWorker.register('sw.js', { scope: '/sapin/' }).catch(function () {}); }
})();
</script>
</body>
</html>
